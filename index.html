<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どっちかな？ おとあてゲーム</title>
    <style>
        body {
            font-family: 'Hiragino Maru Gothic ProN', 'Rounded M+ 1c', sans-serif;
            text-align: center;
            background-color: #fdfbf7;
            margin: 0;
            padding: 20px;
            user-select: none;
        }
        h1 {
            color: #ff8c00;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .controls {
            margin: 20px 0;
            height: 50px;
        }
        button {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.96);
        }
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        #replayBtn {
            background-color: #ff9800;
            color: white;
        }
        /* 左右に大きく2択を並べる */
        .choices-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }
        .choice-card {
            background-color: white;
            border: 5px solid #eee;
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            transition: transform 0.15s, border-color 0.15s;
        }
        .choice-card:hover {
            transform: translateY(-4px);
            border-color: #ffa726;
        }
        .choice-card img {
            width: 170px;
            height: 170px;
            object-fit: contain;
            pointer-events: none;
        }
        #feedback {
            font-size: 2.2rem;
            font-weight: bold;
            margin-top: 30px;
            height: 48px;
        }
        .correct { color: #e91e63; }
        .incorrect { color: #2196f3; }
    </style>
</head>
<body>

    <h1>どっちかな？ おとあてゲーム</h1>
    
    <div class="controls">
        <button id="startBtn" onclick="startGame()">▶️ スタート</button>
        <button id="replayBtn" onclick="replayAudio()" style="display: none;">🔊 もういちどきく</button>
    </div>

    <!-- 左右の2択エリア -->
    <div id="choices" class="choices-container"></div>
    <div id="feedback"></div>

    <script>
        // 「カ行 vs タ行」のミニマルペア定義
        const wordPairs = [
            {
                name: 'か・た',
                ka: { id: 'ika',   text: 'いか', image: './img/ika.jpg' },
                ta: { id: 'ita',   text: 'いた', image: './img/ita.jpg' }
            },
            {
                name: 'こ・と',
                ka: { id: 'hako',  text: 'はこ', image: './img/hako.jpg' },
                ta: { id: 'hato',  text: 'はと', image: './img/hato.jpg' }
            },
            {
                name: 'く・つ',
                ka: { id: 'kutsu', text: 'くつ', image: './img/kutsu.jpg' },
                ta: { id: 'tsutsu',text: 'つつ', image: './img/tsutsu.jpg' }
            }
        ];

        let currentTarget = null;
        let isAnswering = false;

        function startGame() {
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('replayBtn').style.display = 'inline-block';
            nextQuestion();
        }

        function nextQuestion() {
            isAnswering = true;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = '';

            // 1. 3組のペアからランダムで1組選択
            const pair = wordPairs[Math.floor(Math.random() * wordPairs.length)];

            // 2. カ行側かタ行側か、どちらを正解（再生音）にするか決定
            currentTarget = Math.random() < 0.5 ? pair.ka : pair.ta;

            // 3. 左右の配置をシャッフル（位置による当てずっぽうを防止）
            const choices = Math.random() < 0.5 ? [pair.ka, pair.ta] : [pair.ta, pair.ka];

            // 4. 画面に2枚のカードを描画
            const container = document.getElementById('choices');
            container.innerHTML = '';

            choices.forEach(item => {
                const card = document.createElement('div');
                card.className = 'choice-card';
                
                const img = document.createElement('img');
                img.src = item.image;
                img.alt = item.text;

                card.appendChild(img);
                card.onclick = () => selectChoice(item.id);
                container.appendChild(card);
            });

            // 5. 単語を読み上げ
            speak(currentTarget.text);
        }

        function speak(text) {
            speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance(text);
            uttr.lang = 'ja-JP';
            uttr.rate = 0.8;
            uttr.pitch = 1.1;
            speechSynthesis.speak(uttr);
        }

        function replayAudio() {
            if (currentTarget) {
                speak(currentTarget.text);
            }
        }

        function selectChoice(selectedId) {
            if (!isAnswering) return;

            const feedback = document.getElementById('feedback');

            if (selectedId === currentTarget.id) {
                // 正解
                isAnswering = false;
                feedback.textContent = '⭕️ せいかい！';
                feedback.className = 'correct';
                
                speak('せいかい！');
                setTimeout(nextQuestion, 1800);
            } else {
                // 不正解
                feedback.textContent = '❌ もういちどきいてみてね';
                feedback.className = 'incorrect';
                
                setTimeout(() => speak(currentTarget.text), 600);
            }
        }
    </script>
</body>
</html>

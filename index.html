<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>どっちかな？ (カ行・タ行)</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for celebration effects -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Child-friendly rounded font -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #fdfbf7;
            user-select: none; /* Prevent accidental text selection by toddlers */
            -webkit-user-select: none;
            touch-action: manipulation; /* Disable double-tap zoom for smoother tapping */
        }
        
        /* Pulse animation for the listen button */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }

        /* Overlay fade animations */
        .fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        .fade-out { animation: fadeOut 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Game Container -->
    <div class="w-full max-w-2xl bg-white rounded-3xl shadow-xl p-6 md:p-10 border-4 border-amber-100 relative overflow-hidden">
        
        <!-- Header -->
        <h1 class="text-3xl md:text-4xl text-center text-amber-600 mb-8 tracking-wider">
            どっちかな？👂
        </h1>

        <!-- Play Audio Button -->
        <div class="flex justify-center mb-10">
            <button id="btn-listen" 
                class="bg-green-400 hover:bg-green-500 text-white text-2xl md:text-3xl py-4 px-10 rounded-full shadow-lg shadow-green-200 transform transition active:scale-95 flex items-center gap-3 animate-pulse-soft">
                <span>🔊</span>
                <span>おとをきく</span>
            </button>
        </div>

        <!-- Choices Container -->
        <div id="choices-container" class="grid grid-cols-2 gap-4 md:gap-8">
            <!-- Buttons will be injected here by JS -->
        </div>

    </div>

    <!-- Feedback Overlay (⭕️ / ❌) -->
    <div id="feedback-overlay" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center hidden opacity-0 backdrop-blur-sm">
        <div id="feedback-icon" class="text-9xl mb-4 drop-shadow-lg transform transition-transform scale-50"></div>
        <div id="feedback-text" class="text-4xl md:text-6xl font-bold"></div>
    </div>

    <script>
        // Game Data: Minimal pairs for Ka vs Ta column
        const wordPairs = [
            { words: ["しか", "した"], emojis: ["🦌", "👅"] },
            { words: ["いか", "いた"], emojis: ["🦑", "🪵"] },
            { words: ["はこ", "はと"], emojis: ["📦", "🕊️"] },
            { words: ["くつ", "つつ"], emojis: ["👞", "🧻"] },
            { words: ["くり", "つり"], emojis: ["🌰", "🎣"] },
            { words: ["きず", "ちず"], emojis: ["🩹", "🗺️"] }
        ];

        // State variables
        let currentPair = null;
        let targetWord = "";
        let isProcessing = false; // Prevent multiple clicks during animation

        // DOM Elements
        const btnListen = document.getElementById('btn-listen');
        const choicesContainer = document.getElementById('choices-container');
        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackText = document.getElementById('feedback-text');

        // Initialize Web Speech API synthesis
        const synth = window.speechSynthesis;

        // Shuffle array helper
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Start a new round
        function nextRound() {
            isProcessing = false;
            
            // 1. Pick a random pair from the list
            const pairIndex = Math.floor(Math.random() * wordPairs.length);
            currentPair = wordPairs[pairIndex];

            // 2. Decide which word is the target (0 or 1)
            const targetIndex = Math.floor(Math.random() * 2);
            targetWord = currentPair.words[targetIndex];

            // 3. Prepare choice objects and shuffle their display order
            const choices = [
                { word: currentPair.words[0], emoji: currentPair.emojis[0] },
                { word: currentPair.words[1], emoji: currentPair.emojis[1] }
            ];
            shuffle(choices);

            // 4. Render buttons
            choicesContainer.innerHTML = '';
            choices.forEach((choice, index) => {
                const btnColor = index === 0 ? 'text-blue-500 border-blue-200' : 'text-pink-500 border-pink-200';
                const bgHover = index === 0 ? 'hover:bg-blue-50' : 'hover:bg-pink-50';

                const button = document.createElement('button');
                button.className = `flex flex-col items-center justify-center p-6 md:p-10 bg-white border-4 ${btnColor} rounded-3xl shadow-md transform transition active:scale-95 ${bgHover}`;
                button.innerHTML = `
                    <span class="text-7xl md:text-8xl mb-4 pointer-events-none">${choice.emoji}</span>
                    <span class="text-3xl md:text-4xl pointer-events-none">${choice.word}</span>
                `;
                button.onclick = () => handleChoice(choice.word);
                choicesContainer.appendChild(button);
            });

            // Make the listen button pulse to encourage clicking first
            btnListen.classList.add('animate-pulse-soft');
        }

        // Play the target word using Speech Synthesis API
        function playAudio() {
            if (isProcessing) return;
            
            // Stop pulse animation after first click
            btnListen.classList.remove('animate-pulse-soft');

            // Cancel any ongoing speech
            if (synth.speaking) {
                synth.cancel();
            }

            const utterThis = new SpeechSynthesisUtterance(targetWord);
            utterThis.lang = 'ja-JP';
            utterThis.rate = 0.85; // Slightly slower for clearer pronunciation for kids
            utterThis.pitch = 1.2; // Slightly higher pitch to sound friendly
            
            synth.speak(utterThis);
        }

        // Handle user selection
        function handleChoice(selectedWord) {
            if (isProcessing) return;
            isProcessing = true;

            const isCorrect = (selectedWord === targetWord);
            showFeedback(isCorrect);
        }

        // Show Correct/Incorrect overlay
        function showFeedback(isCorrect) {
            feedbackOverlay.classList.remove('hidden');
            feedbackOverlay.classList.remove('fade-out');
            feedbackOverlay.classList.add('fade-in');

            if (isCorrect) {
                // Correct
                feedbackIcon.textContent = "⭕️";
                feedbackIcon.style.transform = "scale(1.2)";
                feedbackText.textContent = "だいせいかい！";
                feedbackText.className = "text-4xl md:text-6xl font-bold text-red-500 drop-shadow-md mt-4";
                
                // Play celebration sound (speech)
                const cheer = new SpeechSynthesisUtterance("せいかい");
                cheer.lang = 'ja-JP';
                cheer.rate = 1.2;
                synth.speak(cheer);

                // Confetti
                confetti({
                    particleCount: 150,
                    spread: 80,
                    origin: { y: 0.4 },
                    colors: ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff']
                });

                // Next round after 2 seconds
                setTimeout(() => {
                    hideFeedback();
                    nextRound();
                }, 2000);

            } else {
                // Incorrect
                feedbackIcon.textContent = "❌";
                feedbackIcon.style.transform = "scale(1)";
                feedbackText.textContent = "ざんねん！";
                feedbackText.className = "text-4xl md:text-6xl font-bold text-blue-600 drop-shadow-md mt-4";
                
                // Let them try again
                setTimeout(() => {
                    hideFeedback();
                    isProcessing = false;
                }, 1500);
            }
        }

        function hideFeedback() {
            feedbackOverlay.classList.remove('fade-in');
            feedbackOverlay.classList.add('fade-out');
            setTimeout(() => {
                feedbackOverlay.classList.add('hidden');
            }, 300); // match animation duration
        }

        // Event Listeners
        btnListen.addEventListener('click', playAudio);

        // Start the game on load
        window.onload = () => {
            nextRound();
        };

    </script>
</body>
</html>
